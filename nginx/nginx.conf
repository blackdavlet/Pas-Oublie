http {
    server {
        listen 80;                      # Port to listen on
        server_name example.com;        # Domain name

        location / {
            root /var/www/html;         # Directory for static files
            index index.html;           # Default file
        }

        location /api {
            proxy_pass http://localhost:8080; # Reverse proxy to backend
        }
    }
}