services:
  nginx:
    image: nginx:1.27-alpine
    container_name: pa_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - appnet

  frontend:
    build: ./frontend
    container_name: pa_frontend
    restart: always
    networks:
      - appnet

  backend1:
    build: ./backend
    ports:
      - "8000:8000"
    container_name: pa_backend1
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      STORAGE_SERVICE_URL: storage_service:50051
      SEARCH_SERVICE_URL: search_service:50052
      SEAWEED_MASTER: seaweedfs:9333
      SEAWEED_FILER: seaweedfs:8080
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MACHINE_ID: 1
    depends_on:
      - postgres
      - redis
      - seaweedfs
      - storage_service
      - search_service
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend2:
    build: ./backend
    ports:
      - "8000:8000"
    container_name: pa_backend1
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      STORAGE_SERVICE_URL: storage_service:50051
      SEARCH_SERVICE_URL: search_service:50052
      SEAWEED_MASTER: seaweedfs:9333
      SEAWEED_FILER: seaweedfs:8080
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MACHINE_ID: 2
    depends_on:
      - postgres
      - redis
      - seaweedfs
      - storage_service
      - search_service
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 3

  storage_service:
    build: ./storage_service
    container_name: pa_storage
    restart: always
    environment:
      SEAWEED_MASTER: seaweedfs:9333
      
    depends_on:
      - seaweedfs
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:50051", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

  search_service:
    build: ./search_service
    container_name: pa_search
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - postgres
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:50052", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

  index-worker:
    build: ./index-worker
    container_name: pa_worker
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
      SEAWEED_MASTER: seaweedfs:9333
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - postgres
      - redis
      - seaweedfs
    networks:
      - appnet

  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: pa_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pa_redis
    restart: always
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: pa_seaweed
    restart: always
    command: "server -dir=/data -s3"
    volumes:
      - ./seaweedfs/data:/data
    ports:
      - "9000:9000" # s3-compatible api
      - "9333:9333" #master
      - "8080:8080" # volume server
    networks:
      - appnet

  prometheus:
    image: prom/prometheus:latest
    container_name: pa_prometheus
    restart: always
    volumes:
      # Mount the local configuration file to the Prometheus container
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090" # Expose Prometheus dashboard on host port 9090
    networks:
      - appnet
    depends_on:
      - backend1
      - backend2   # Ensure the backend service starts before Prometheus

  grafana:
    image: grafana/grafana-oss:latest
    container_name: pa_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD= ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - appnet
    depends_on:
      - prometheus


networks:
  appnet:
    driver: bridge

volumes:
  pgdata:
  seaweedfs_data:
  grafana_data:
